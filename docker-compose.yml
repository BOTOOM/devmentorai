services:
  backend:
    build:
      context: .
      dockerfile: docker/remote-backend/Dockerfile
    container_name: devmentorai-backend
    environment:
      DEVMENTORAI_PORT: ${BACKEND_PORT:-3847}
      NODE_ENV: production
      COPILOT_GITHUB_TOKEN: ${COPILOT_GITHUB_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      COPILOT_TOKEN: ${COPILOT_TOKEN:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,backend}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-3847}:${BACKEND_PORT:-3847}"
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"
    volumes:
      - ${DEVMENTORAI_COPILOT_VOLUME:-devmentorai-copilot}:/home/devmentor/.copilot
      - ${DEVMENTORAI_DATA_VOLUME:-devmentorai-data}:/home/devmentor/.devmentorai
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - custom_net

  # Optional tunnel for external sharing (ngrok).
  # Start with: docker compose --profile tunnel-ngrok up -d
  ngrok:
    image: ngrok/ngrok:latest
    command:
      - "http"
      - "http://backend:${BACKEND_PORT:-3847}"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    depends_on:
      - backend
    networks:
      - custom_net
    profiles:
      - tunnel-ngrok

  # Optional tunnel alternative for external sharing (Cloudflare Quick Tunnel).
  # Start with: docker compose --profile tunnel-cloudflare up -d
  cloudflare:
    image: cloudflare/cloudflared:latest
    command:
      - "tunnel"
      - "--no-autoupdate"
      - "--url"
      - "http://backend:${BACKEND_PORT:-3847}"
    depends_on:
      - backend
    networks:
      - custom_net
    profiles:
      - tunnel-cloudflare

networks:
  custom_net:
    name: devmentorai_custom_net

volumes:
  devmentorai-copilot:
    name: devmentorai-copilot
  devmentorai-data:
    name: devmentorai-data
